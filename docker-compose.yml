# Container logs are capped here and archived by ops/bin/am-logs-archive.sh.
# Without the cap the json-file driver grows without bound.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    container_name: finance-db
    environment:
      POSTGRES_USER: postgres
      # Only read when the volume is first created. To change the password of
      # an existing database, ALTER ROLE first, then set this to match.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: finance_ide
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    ports:
      # Loopback by default: nothing outside this machine needs the database.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - admin

  # One-shot, on every `up`: migrations and database privileges, as the table
  # owner (WP32 W5). The applications connect as am_user_app / am_admin_app and
  # never run DDL. Roles are created once with ops/bin/am-db-roles.sh.
  migrate:
    build:
      context: ./backend
    container_name: finance-migrate
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=${APP_ENV:-development}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (see .env.example)}
      - ENCRYPTION_KEY_PREVIOUS=${ENCRYPTION_KEY_PREVIOUS:-}
      - DATABASE_URL=postgresql+psycopg2://am_owner:${AM_DB_OWNER_PASSWORD:?set AM_DB_OWNER_PASSWORD in .env (see .env.example)}@db:5432/finance_ide
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: sh -c "alembic upgrade head && python -m app.maintenance.db_grants --apply"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    build:
      context: ./backend
    container_name: finance-backend
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-18100}:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    environment:
      # Without this, uvicorn's access log sits in Python's stdout buffer and
      # `docker logs` shows nothing until the container stops.
      - PYTHONUNBUFFERED=1
      - APP_ENV=${APP_ENV:-development}
      # Least privilege (app/db_access.py): no DDL, no administrator tables.
      - DATABASE_URL=postgresql+psycopg2://am_user_app:${AM_DB_USER_APP_PASSWORD:?set AM_DB_USER_APP_PASSWORD in .env (see .env.example)}@db:5432/finance_ide
      # No defaults for the three secrets. A default here is a published
      # secret: this file is in a public repository, and a token signed with
      # a known key is accepted as any user. Generate them (see .env.example).
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env (see .env.example)}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (see .env.example)}
      # Old keys that may still decrypt, during a rotation only.
      - ENCRYPTION_KEY_PREVIOUS=${ENCRYPTION_KEY_PREVIOUS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:15173,http://127.0.0.1:5173,http://127.0.0.1:15173}
      - MCP_JWT_SECRET=${MCP_JWT_SECRET:?set MCP_JWT_SECRET in .env (see .env.example)}
      - MCP_TOKEN_AUDIENCE=${MCP_TOKEN_AUDIENCE:-asset-management-backend}
      - MCP_BASE_URL=${MCP_BASE_URL:-http://localhost:13000}
      - MCP_ALLOWED_ISSUERS=${MCP_ALLOWED_ISSUERS:-http://localhost:13000,https://localhost:13000}
      # Logging (app/utils/observability). json | text.
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DB_CHANGES=${LOG_DB_CHANGES:-1}
      - LOG_SLOW_SQL_MS=${LOG_SLOW_SQL_MS:-500}
      - LOG_SQL=${LOG_SQL:-0}
      # Auto-reload is opt-in: BACKEND_RELOAD=1 docker compose up -d backend
      # Off by default so startup stays deterministic. It works as long as the
      # repository lives on a Linux filesystem. From a Windows bind mount
      # (/mnt/c/...) there is no inotify, and the watcher dies with
      # "Input/output error (os error 5)", taking the container with it.
      - BACKEND_RELOAD=${BACKEND_RELOAD:-0}
    # Migrations run in the migrate service, as the table owner.
    command: >
      sh -c "if [ \"$$BACKEND_RELOAD\" = \"1\" ]; then
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app;
      else
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000;
      fi"
    healthcheck:
      # Liveness on purpose (/health, not /health/ready): restarting this
      # container does not repair a database outage.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  admin:
    build:
      context: ./backend
      dockerfile: Dockerfile.admin
      additional_contexts:
        frontend: ./frontend
    container_name: finance-admin
    ports:
      # Only ever bind to loopback or the VPN address, never 0.0.0.0.
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-18300}:8000"
    volumes:
      - ./backend/app:/app/app:ro
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=${APP_ENV:-development}
      # Least privilege (app/db_access.py): reads accounts, writes only the admin tables and account status.
      - DATABASE_URL=postgresql+psycopg2://am_admin_app:${AM_DB_ADMIN_APP_PASSWORD:?set AM_DB_ADMIN_APP_PASSWORD in .env (see .env.example)}@db:5432/finance_ide
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (see .env.example)}
      - ENCRYPTION_KEY_PREVIOUS=${ENCRYPTION_KEY_PREVIOUS:-}
      - ADMIN_ALLOWED_HOSTS=${ADMIN_ALLOWED_HOSTS:-admin.localhost}
      - ADMIN_ALLOWED_ORIGINS=${ADMIN_ALLOWED_ORIGINS:-http://admin.localhost:${ADMIN_PORT:-18300}}
      - ADMIN_COOKIE_SECURE=${ADMIN_COOKIE_SECURE:-0}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DB_CHANGES=${LOG_DB_CHANGES:-1}
      - LOG_SLOW_SQL_MS=${LOG_SLOW_SQL_MS:-500}
      - LOG_SQL=${LOG_SQL:-0}
    networks:
      - admin
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host': 'admin.localhost'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/api
    container_name: finance-frontend
    ports:
      # The one port meant to be reached from other devices (a phone on the
      # LAN, the Cloudflare tunnel). Set FRONTEND_BIND=127.0.0.1 if the tunnel
      # is the only way in.
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-15173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # service_started, not service_healthy: nginx now resolves the backend at
    # request time, so it should come up and serve the SPA even when the API is
    # down. Blocking on backend health would hide the UI exactly when it is
    # most useful for diagnosing.
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mcp:
    build:
      context: ./mcp
    container_name: finance-mcp
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-13000}:3000"
    environment:
      - PORT=3000
      - APP_ENV=${MCP_APP_ENV:-development}
      - BASE_URL=${MCP_BASE_URL:-http://localhost:13000}
      - JWT_SECRET=${MCP_JWT_SECRET:?set MCP_JWT_SECRET in .env (see .env.example)}
      - BACKEND_TOKEN_AUDIENCE=${MCP_TOKEN_AUDIENCE:-asset-management-backend}
      - BACKEND_URL=http://backend:8000
      - BACKEND_USERNAME=${BACKEND_USERNAME:-}
      - BACKEND_PASSWORD=${BACKEND_PASSWORD:-}
      # 1 logs request and response bodies (financial data) for debugging a
      # client integration. Leave off otherwise.
      - MCP_LOG_BODIES=${MCP_LOG_BODIES:-0}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  default:
  admin:
    driver: bridge

volumes:
  postgres_data:
