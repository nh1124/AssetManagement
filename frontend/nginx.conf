# One JSON object per request, carrying the id the backend logs under
# (correlation_id), so a line here can be joined to what the request did.
log_format am_json escape=json
    '{"ts":"$time_iso8601","component":"nginx","event":"edge.request",'
    '"correlation_id":"$request_id","method":"$request_method","path":"$uri",'
    '"status":$status,"duration_s":$request_time,"bytes":$body_bytes_sent,'
    '"client_ip":"$remote_addr","forwarded_for":"$http_cf_connecting_ip",'
    '"upstream_status":"$upstream_status","user_agent":"$http_user_agent"}';

# Credential endpoints are the only ones worth guessing at. The key is empty
# for every other path, and an empty key is not rate limited.
map $uri $auth_limit_key {
    default "";
    ~^/api/auth/(?:login|register|mfa/login/verify|reauth|step-up/verify)$ $binary_remote_addr;
}
# Through the Cloudflare tunnel every request arrives from one address, so
# this is in effect a limit on the endpoint, which is what a single-user
# system wants: 20 attempts a minute, from anywhere, is already an attack.
limit_req_zone $auth_limit_key zone=auth_attempts:1m rate=20r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/access.log am_json;

    # A full export of one client is re-imported as a single JSON body; the
    # 1 MB default would reject it once the ledger grows.
    client_max_body_size 25m;

    # The app loads only its own bundle and talks only to its own API.
    # 'unsafe-inline' is for style attributes (React inline styles, charts);
    # scripts get no such allowance. data:/blob: images are the MFA QR code.
    # Google Fonts is the one outside source: index.css imports Inter and
    # JetBrains Mono from it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The backend half of the MCP server's OAuth (WP35): only the MCP container
    # calls it, over the compose network. From outside it would be a second,
    # unthrottled sign-in and token endpoint.
    location ^~ /api/auth/mcp/ {
        return 404;
    }

    # Proxy API requests to the backend container.
    #
    # The upstream host is held in a variable on purpose. With a literal
    # `proxy_pass http://backend:8000/` nginx resolves the name once at
    # startup and refuses to boot when the backend is down ("host not found in
    # upstream"), which put this container into a restart loop. Going through a
    # variable defers the lookup to request time via Docker's embedded DNS, so
    # nginx stays up and a missing backend surfaces as a 502 instead.
    #
    # The regex capture reproduces what the trailing slash used to do: strip
    # the /api prefix before forwarding. It is a named capture because the
    # rate-limit map above runs a second regex before proxy_pass is evaluated,
    # and that replaces the positional $1 (it turned /api/auth/login into
    # /login).
    location ~ ^/api/(?<api_path>.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_host backend;

        limit_req zone=auth_attempts burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://$backend_host:8000/$api_path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Always ours, never the caller's: the backend trusts this header as
        # the correlation id.
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
