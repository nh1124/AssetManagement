# Container-local maintenance socket (docker exec psql / ops / am-db-roles).
local all all trust
# Never permit the postgres superuser over IPv4 TCP, including the published port.
host all postgres 0.0.0.0/0 reject
# Never permit the postgres superuser over IPv6 TCP, including the published port.
host all postgres ::/0 reject
# Application and owner roles must authenticate over IPv4 with SCRAM.
host all all 0.0.0.0/0 scram-sha-256
# Application and owner roles must authenticate over IPv6 with SCRAM.
host all all ::/0 scram-sha-256
